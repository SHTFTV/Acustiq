name: Restore full Acustiq site

on:
  push:
    paths:
      - 'site-restore.tar.xz.b64'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore sanitized source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f site-restore.tar.xz.b64 ]; then
            echo "Restore archive already consumed."
            exit 0
          fi
          base64 -d site-restore.tar.xz.b64 > /tmp/acustiq-site.tar.xz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name site-restore.tar.xz.b64 -exec rm -rf {} +
          tar -xJf /tmp/acustiq-site.tar.xz -C .
          rm -f site-restore.tar.xz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to restore."
            exit 0
          fi
          git commit -m "Restore full sanitized Acustiq authority site"
          git push
